        - generic [ref=f5e66]:
          - blockquote [ref=f5e67]:
            - paragraph [ref=f5e68]: Chris is the kind of Senior QA every team hopes to have - passionate about UI/UX, deeply invested in tools design, and always thinking about how to make things better for the people using them. I worked closely with him on the Systems team while leading embedded QA and managing external testing support. His attention to usability, combined with strong testing instincts, helped streamline test documentation, reduce inefficiencies, and increase overall quality. He's thoughtful, reliable, and a true partner in delivering great player experiences. I'd highly recommend him.
            - generic [ref=f5e69]: — Hector Melendres, QA Manager
          - blockquote [ref=f5e70]:
            - paragraph [ref=f5e71]: It was a pleasure working with Chris. He is always eager to learn new skills and pro-actively proposes major tool improvements and potential new workflows. Iteratively working together with Chris on new tools feels seamlessly and is a lot of fun. He was always a highly valuable part of the team and respected across the board. His fast way to adapt, his always positive attitude and his grow into the UX designer position over the years was really impressive.
            - generic [ref=f5e72]: — Sascha Hoba, Senior Lead Development Tools Programmer
