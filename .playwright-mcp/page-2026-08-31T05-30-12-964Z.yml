        - generic [ref=f1e23]:
          - paragraph [ref=f1e24]: I grew up playing video and board games with my family and that led to a career in game development.
          - paragraph [ref=f1e25]: After graduating from DePaul University, I have worked on a variety of games on most every platform as a Senior Quality Assurance Analyst and User Experience Developer.
          - paragraph [ref=f1e26]: I enjoy setting up effective QA teams and plans from scratch or working to improve established user workflows. My aim is to continuously deliver high quality reports and improve best practices which benefit the entire development team.
          - paragraph [ref=f1e27]: I currently reside in Los Angeles, California and am open to working with good people on cool projects.
