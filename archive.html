<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script>/* flash-prevention: reads saved theme before CSS loads to prevent a visible colour flicker */(function(){var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);}());</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archive — Christopher Klein</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <div id="nav-placeholder"></div>

    <!-- Archive filter header — scrolls away with page -->
    <div class="archive-sticky-header" id="archive-sticky-header">
        <div class="container">

            <!-- Title row -->
            <div class="archive-title-row">
                <h1 class="archive-title" id="archive-title">Archive</h1>
            </div>

            <!-- Controls row:
                 Desktop (uncondensed): Clear (left) + Search (fills width). No sort toggle, no Filters trigger.
                 Mobile/tablet: Clear + Search + Filters trigger. Filters trigger hidden on desktop via CSS. -->
            <div class="archive-controls-row">
                <button class="archive-clear-btn btn btn--ghost" type="button" disabled>Clear</button>
                <label for="archive-search" class="sr-only">Search entries</label>
                <input type="search" class="archive-search-input" id="archive-search"
                       placeholder="Search" autocomplete="off">
                <button class="filter-drawer-trigger" type="button"
                        aria-expanded="false"
                        aria-controls="filter-drawer"
                        aria-haspopup="dialog">
                    <span class="trigger-label">Filters</span>
                    <span class="action-rail-badge" aria-hidden="true" hidden>0</span>
                </button>
            </div>

            <!-- Desktop inline filters — primary chips, active chips row, and secondary tags;
                 visible only on desktop while header is uncondensed (top of page);
                 hidden on tablet/mobile at every scroll position — those breakpoints use the drawer -->
            <div class="archive-inline-filters" id="archive-inline-filters">

                <!-- Primary type chips: Work / Thoughts -->
                <div class="archive-primary-chips" role="group" aria-label="Filter by type">
                    <button class="tag-chip" type="button"
                            data-filter-type="work" data-label="Work"
                            aria-pressed="false">Work<span class="chip-count" aria-hidden="true"></span></button>
                    <button class="tag-chip" type="button"
                            data-filter-type="thoughts" data-label="Thoughts"
                            aria-pressed="false">Thoughts<span class="chip-count" aria-hidden="true"></span></button>
                </div>

                <!-- Active secondary filters row — collapses to zero height when empty -->
                <div class="archive-active-chips" id="archive-active-chips"></div>

                <!-- Secondary tag chips — populated by JS -->
                <div id="archive-secondary-chips" aria-label="Filter by tag"></div>

            </div>

        </div>
    </div>

    <!-- Sentinel watched by IntersectionObserver — when this leaves viewport, show action-rail-group -->
    <div id="archive-header-sentinel" aria-hidden="true"></div>

    <!-- Floating action rail group — fixed at right viewport edge; visible when header has condensed -->
    <div class="action-rail-group" id="action-rail-group">

        <!-- Filters trigger — opens Filter Drawer -->
        <button class="action-rail-trigger" type="button"
                aria-controls="filter-drawer"
                aria-haspopup="dialog"
                aria-expanded="false"
                aria-label="Open filters">
            <span class="trigger-label">Filters</span>
            <span class="action-rail-badge" aria-hidden="true" hidden>0</span>
        </button>

    </div>

    <!-- Scrim — dims page content while drawer is open; clicking closes the drawer -->
    <div class="archive-scrim" id="archive-scrim" aria-hidden="true" hidden></div>

    <!-- Filter drawer — unified bottom sheet, available on all breakpoints -->
    <div class="filter-drawer" id="filter-drawer"
         role="dialog" aria-modal="true" aria-label="Search and filter"
         hidden inert>
        <div class="filter-drawer-body">

            <!-- Row 1: Clear (left) · Search (fills width) · Filters/Close trigger (right) -->
            <div class="filter-drawer-controls">
                <button class="archive-clear-btn btn btn--ghost" type="button" disabled>Clear</button>
                <label for="drawer-search" class="sr-only">Search entries</label>
                <input type="search" class="archive-search-input" id="drawer-search"
                       placeholder="Search" autocomplete="off">
                <button class="filter-drawer-trigger" type="button"
                        aria-expanded="false"
                        aria-controls="filter-drawer"
                        aria-haspopup="dialog">
                    <span class="trigger-label">Filters</span>
                </button>
            </div>

            <!-- Row 2: Primary type chips -->
            <div class="filter-drawer-primary-chips" role="group" aria-label="Filter by type">
                <button class="tag-chip" type="button"
                        data-filter-type="work" data-label="Work"
                        aria-pressed="false">Work<span class="chip-count" aria-hidden="true"></span></button>
                <button class="tag-chip" type="button"
                        data-filter-type="thoughts" data-label="Thoughts"
                        aria-pressed="false">Thoughts<span class="chip-count" aria-hidden="true"></span></button>
            </div>

            <!-- Row 3: Secondary tag chips populated by initArchive() -->
            <div id="filter-drawer-chips"></div>

        </div>
    </div>

    <main id="main-content">
        <div class="container">

            <!-- Sort toggle (left) and entry count (right) — between header and results grid -->
            <div class="archive-sort-count-row">
                <button class="archive-sort-toggle" type="button">Latest ↑</button>
                <p class="archive-count" id="archive-count" aria-live="polite">Loading…</p>
            </div>

            <!-- Cards populated by initArchive() -->
            <div class="archive-results" id="archive-results"></div>

            

            <div class="archive-load-more-row">
                <button class="archive-load-more-btn btn btn--ghost" type="button"
                        aria-label="Load more archive entries" hidden>
                    Load More
                </button>
            </div>

            <div class="back-to-top-row">
                <button class="back-to-top" aria-label="Back to top">
                    <span>Back to Top</span>
                </button>
            </div>

        </div>
    </main>

    <div role="status" aria-live="polite" class="toast">URL copied to clipboard!</div>

    <nav class="tab-bar" aria-label="Mobile navigation">
        <a href="/index.html" class="tab-bar-item">
            <span>Home</span>
        </a>
        <a href="/archive.html?type=work" class="tab-bar-item">
            <span>Work</span>
        </a>
        <a href="/archive.html?type=thoughts" class="tab-bar-item">
            <span>Thoughts</span>
        </a>
        <a href="/about.html" class="tab-bar-item">
            <span>About</span>
        </a>
    </nav>

    <div id="footer-placeholder"></div>
    <script src="/script.js"></script>
</body>
</html>
